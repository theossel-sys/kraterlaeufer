<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kraterläufer">
<meta name="theme-color" content="#0a0716">
<title>Kraterläufer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --neon: #ff3fa4; --cyan: #3ff2ff; --amber: #ffc53d; --ink: #0a0716; }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .ov { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    font-family: 'Press Start 2P', monospace; color: #fff; text-align: center; padding: 24px; box-sizing: border-box; z-index: 5; }
  .ov[hidden] { display: none; }
  .ov.dim { background: radial-gradient(ellipse at 50% 40%, rgba(40,10,60,.35), rgba(5,3,12,.85)); }
  #title.dim { background: linear-gradient(rgba(5,3,12,.2), rgba(5,3,12,.75) 70%), url(assets/title.jpg) center / cover no-repeat, var(--ink); }
  .logo { font-size: clamp(24px, 6.5vw, 54px); line-height: 1.15; letter-spacing: 2px; color: #fff;
    text-shadow: 0 0 6px var(--cyan), 0 0 18px var(--cyan), 3px 3px 0 var(--neon), 6px 6px 0 #000; transform: skewX(-8deg); }
  .sub { font-size: 10px; color: #c9b8ff; line-height: 1.9; max-width: 420px; }
  .btn { font-family: inherit; font-size: 12px; color: var(--ink); background: var(--cyan); border: 0; padding: 13px 18px;
    box-shadow: 0 0 14px rgba(63,242,255,.6), 0 4px 0 #157f88; cursor: pointer; min-width: 200px; }
  .btn.ghost { background: transparent; color: #fff; box-shadow: none; border: 2px solid #5a4a8a; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .hi { font-size: 10px; color: var(--amber); }
  .help { font-size: 8px; color: #b7aee0; line-height: 2; max-width: 460px; }
  .score { font-size: 18px; color: var(--amber); }
  #pad { position: fixed; inset: 0; z-index: 4; pointer-events: none; display: none; }
  #pad button { position: absolute; pointer-events: auto; border-radius: 50%; border: 2px solid rgba(255,255,255,.35);
    background: rgba(20,10,40,.35); color: #fff; font-family: 'Press Start 2P', monospace; font-size: 9px;
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); touch-action: none; }
  #pad button.on { background: rgba(63,242,255,.35); border-color: var(--cyan); box-shadow: 0 0 14px rgba(63,242,255,.6); }
  #bL, #bR { width: 64px; height: 64px; bottom: calc(env(safe-area-inset-bottom) + 14px); font-size: 20px !important; }
  #bL { left: calc(env(safe-area-inset-left) + 14px); }
  #bR { left: calc(env(safe-area-inset-left) + 90px); }
  #bJ, #bF { width: 76px; height: 76px; bottom: calc(env(safe-area-inset-bottom) + 14px); }
  #bF { right: calc(env(safe-area-inset-right) + 14px); background: rgba(255,63,164,.35) !important; border-color: rgba(255,63,164,.7) !important; }
  #bJ { right: calc(env(safe-area-inset-right) + 102px); bottom: calc(env(safe-area-inset-bottom) + 40px); }
  #pauseBtn { position: fixed; z-index: 4; right: calc(env(safe-area-inset-right) + 10px); top: calc(env(safe-area-inset-top) + 8px);
    width: 38px; height: 38px; background: rgba(0,0,0,.35); color: #fff; border: 2px solid rgba(255,255,255,.4);
    font-family: 'Press Start 2P', monospace; font-size: 11px; display: none; }
  #rotate { position: fixed; inset: 0; z-index: 9; background: var(--ink); color: #fff; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; font-family: 'Press Start 2P', monospace; font-size: 11px; text-align: center; padding: 24px; }
  #rotate svg { width: 80px; height: 80px; animation: turn 2s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
  @media (max-height: 500px) {
    .ov { gap: 9px; padding: 12px; }
    .logo { font-size: 30px; }
    .sub { font-size: 8px; line-height: 1.7; }
    .btn { padding: 10px 14px; min-width: 170px; font-size: 11px; }
    .help { font-size: 7px; line-height: 1.8; }
  }
  /* große unsichtbare Trefferflächen um die Touch-Knöpfe */
  #pad button::after, #bombBtn::after, #pauseBtn::after { content: ''; position: absolute; inset: -16px; border-radius: 50%; }
  #pauseBtn::after { border-radius: 8px; inset: -10px; }
  html, body, canvas, #wrap { touch-action: none; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="400" height="225"></canvas></div>
<div id="pad">
  <button id="bL" aria-label="Bremsen">◀</button><button id="bR" aria-label="Gas">▶</button>
  <button id="bJ" aria-label="Springen">SPRUNG</button><button id="bF" aria-label="Feuer">FEUER</button>
</div>
<button id="pauseBtn" aria-label="Pause">II</button>

<div id="title" class="ov dim">
  <div class="logo">KRATER<br>LÄUFER</div>
  <div class="sub">Steuere den Rover über die Mondmeere.<br>Spring über Krater, schieß nach vorn und nach oben.</div>
  <div class="hi" id="hiTitle"></div>
  <button class="btn" id="start">START</button>
  <div class="row"><button class="btn ghost" id="sound">TON: AN</button></div>
  <div class="help">HANDY: ◀ ▶ Tempo · SPRUNG (halten = höher) · FEUER (halten = Dauerfeuer)<br>PC: ← → Tempo · ↑ oder Leertaste springen · X feuern · P Pause</div>
</div>
<div id="pause" class="ov dim" hidden>
  <div class="logo" style="font-size:26px">PAUSE</div>
  <button class="btn" id="resume">WEITER</button>
  <button class="btn ghost" id="quit">AUFGEBEN</button>
</div>
<div id="over" class="ov dim" hidden>
  <div class="logo" style="font-size:24px">MISSION<br>BEENDET</div>
  <div class="score" id="finalScore"></div>
  <div class="hi" id="hiOver"></div>
  <button class="btn" id="again">NOCHMAL</button>
</div>
<div id="rotate">
  <svg viewBox="0 0 64 64" fill="none" stroke="#3ff2ff" stroke-width="3" aria-hidden="true"><rect x="20" y="6" width="24" height="52" rx="4"/><circle cx="32" cy="50" r="2"/></svg>
  Bitte das Gerät<br>quer halten
</div>
<script src="game.js"></script>
</body>
</html>
